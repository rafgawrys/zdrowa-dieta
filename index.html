<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zdrowa dieta</title>
  <style>
    :root{--ink:#18302a;--muted:#687a73;--line:#dbe7e0;--bg:#f4f8f5;--green:#28755e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px 16px 48px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.4rem)}p{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.card b{font-size:1.55rem;display:block}.card span{font-size:.86rem;color:var(--muted)}h2{font-size:1.12rem;margin:0 0 12px}.day{border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:10px}.top,.row{display:grid;grid-template-columns:98px 1fr auto;gap:8px}.top{display:flex;justify-content:space-between;font-weight:700}.total{color:var(--green)}.row{border-top:1px solid #edf2ef;padding:7px 0;font-size:.92rem}.row span:nth-child(2){color:var(--muted)}form{display:grid;grid-template-columns:1fr .8fr 1.5fr .55fr auto;gap:8px}input,select,button{font:inherit;border:1px solid #c9d8d0;border-radius:9px;padding:9px;background:#fff}button{border:0;background:var(--green);color:#fff;font-weight:700;cursor:pointer}@media(max-width:650px){main{padding:18px 12px}.stats{gap:8px}.card{padding:13px}.row{grid-template-columns:82px 1fr auto;font-size:.85rem}form{grid-template-columns:1fr 1fr}#note,button{grid-column:span 2}}
  </style>
</head><body><main>
  <h1>Moje posiłki</h1><p>Historia kalorii • 19.08–02.09.2026 • wartości szacunkowe</p>
  <section class="stats"><div class="card"><b id="days"></b><span>dni z wpisami</span></div><div class="card"><b id="sum"></b><span>kcal łącznie</span></div><div class="card"><b id="avg"></b><span>średnio / dzień</span></div></section>
  <section class="card"><h2>Dodaj posiłek</h2><form id="form"><input id="date" type="date" required><select id="kind"><option>Śniadanie</option><option>Obiad</option><option>Kolacja</option><option>Przekąska</option></select><input id="note" placeholder="Opis posiłku" required><input id="kcal" type="number" min="0" placeholder="kcal" required><button>Dodaj</button></form></section>
  <section class="card" style="margin-top:16px"><h2>Historia</h2><div id="list"></div></section>
</main><script>
const seed=[['2026-09-02','Śniadanie',226,'Jogurt Zott, pestki i owoce'],['2026-09-02','Obiad',438,'Kurczak, kukurydza i sałata'],['2026-09-02','Kolacja',243,'Jajecznica, pomidor i szynka'],['2026-09-01','Śniadanie',327,'Jogurt Zott, pestki i suszone owoce'],['2026-09-01','Obiad',381,'Sałatka z tuńczykiem i awokado'],['2026-09-01','Kolacja',820,'Paccheri al ragù'],['2026-08-31','Śniadanie',219,'Twaróg, rzodkiewka i mleko'],['2026-08-31','Obiad',518,'Polędwica, mozzarella i pomidory'],['2026-08-31','Kolacja',582,'Sałatka grecka, 700 g'],['2026-08-30','Śniadanie',210,'Jogurt Pilos i owoce'],['2026-08-30','Obiad',500,'Spring rollsy z kurczakiem'],['2026-08-29','Śniadanie',378,'Jogurt, pestki, śliwki i owoce'],['2026-08-29','Obiad',500,'Risotto z kurczakiem'],['2026-08-28','Śniadanie',333,'Granola'],['2026-08-28','Obiad',400,'Halibut wędzony'],['2026-08-28','Kolacja',637,'Makaron z sosem kurkowym'],['2026-08-27','Śniadanie',278,'Warzywa, awokado i szynka'],['2026-08-27','Obiad',513,'Polędwica i puree'],['2026-08-27','Kolacja',548,'Pomidory i burrata'],['2026-08-26','Śniadanie',190,'Warzywa i fasola'],['2026-08-26','Obiad',510,'Łosoś i kapusta'],['2026-08-26','Kolacja',193,'Skyr, dżem i wiśnie'],['2026-08-25','Śniadanie',329,'Sałatka z tuńczykiem'],['2026-08-25','Obiad',339,'Kurczak, ryż i kapusta'],['2026-08-25','Kolacja',342,'Twaróg i rzodkiewka'],['2026-08-24','Śniadanie',225,'Jogurt, jabłko i owoce'],['2026-08-24','Obiad',700,'Zupa rybna, gofr i lody'],['2026-08-24','Kolacja',404,'Chorizo z jajkami'],['2026-08-23','Śniadanie',300,'Jajecznica z szynką'],['2026-08-23','Obiad',505,'Dorada i warzywa']];
const $=s=>document.querySelector(s), custom=JSON.parse(localStorage.getItem('zdrowa-dieta-custom')||'[]'), all=()=>[...seed,...custom];function draw(){let g={};all().forEach(x=>(g[x[0]]??=[]).push(x));let d=Object.keys(g).sort().reverse(),s=all().reduce((a,x)=>a+x[2],0);$('#days').textContent=d.length;$('#sum').textContent=s.toLocaleString('pl-PL')+' kcal';$('#avg').textContent=Math.round(s/d.length)+' kcal';$('#list').innerHTML=d.map(x=>{let m=g[x],t=m.reduce((a,y)=>a+y[2],0),label=new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit',weekday:'short'}).format(new Date(x+'T12:00'));return `<article class="day"><div class="top"><span>${label}</span><span class="total">${t} kcal</span></div>${m.map(y=>`<div class="row"><b>${y[1]}</b><span>${y[3]}</span><b>${y[2]} kcal</b></div>`).join('')}</article>`}).join('')}$('#date').value=new Date().toISOString().slice(0,10);$('#form').onsubmit=e=>{e.preventDefault();custom.push([$('#date').value,$('#kind').value,+$('#kcal').value,$('#note').value]);localStorage.setItem('zdrowa-dieta-custom',JSON.stringify(custom));e.target.reset();$('#date').value=new Date().toISOString().slice(0,10);draw()};draw();
</script></body></html>
